# IntelliStream Chat — Keycloak login theme.
#
# ---------------------------------------------------------------------------------------------
# KEEP THE OVERRIDE SURFACE SMALL. This directory contains exactly one .ftl (footer.ftl, which
# Keycloak ships empty specifically to be overridden). Everything else is this file, one
# stylesheet, two SVGs and the font.
#
# That is deliberate. A theme that forks the whole FreeMarker template set looks fine on the day
# you build it and rots invisibly afterwards: Keycloak keeps rendering YOUR three-versions-old
# copy of login.ftl / template.ftl / user-profile-commons.ftl, and you discover it when passkeys,
# organizations, a new required action or a security fix to the login form silently stops
# working. Nothing warns you — an outdated template is a valid template.
#
# So before copying a .ftl in here, check in this order:
#   1. can a CSS rule in resources/css/intellistream.css do it?
#   2. can a kc*Class property below do it (the templates read every class name from here)?
#   3. only then, copy the template — and write down why, so the next upgrade knows what to diff.
# ---------------------------------------------------------------------------------------------

parent=keycloak
import=common/keycloak

# The stylesheet is self-contained, so PatternFly goes away entirely.
#
# `styles` and `stylesCommon` REPLACE the parent's values rather than merging with them, and the
# empty `stylesCommon` is what unloads patternfly-v3 + patternfly-v4 (~600 KB of CSS). Leaving
# them loaded would mean writing every rule below to out-specify a framework we do not otherwise
# use, and inheriting its light-only colour tokens. The class names PatternFly would have styled
# (.pf-c-form-control, .pf-c-button, .pf-c-alert…) still appear in the markup — the templates
# take them from the kc*Class properties inherited from the parent theme — so intellistream.css
# styles those names directly and there is nothing to fight.
styles=css/intellistream.css
stylesCommon=

# The favicon list is a list of PATHS, not ids: Keycloak's ThemeResourcesParser uses each entry
# verbatim as the resource path and derives type="image/svg+xml" from the extension. (The
# `favicons.<id>.<attr>` form in the parser cannot set `path` — that is the builder's constructor
# argument — so naming an id here just serves a 404 at /resources/…/login/intellistream/<id>.)
favicons=img/favicon.svg

meta=viewport==width=device-width,initial-scale=1

# PatternFly's icon fonts left with its CSS, so the seven properties that resolved to Font Awesome
# classes are re-pointed at .ic-* rules in the stylesheet, which draw each glyph from an inline
# SVG mask. The two password ones must stay defined here and nowhere else: the templates emit them
# into data-icon-show / data-icon-hide and base's passwordVisibility.js swaps the class strings on
# click, so a hardcoded class in CSS-land would desync the toggle.
kcFeedbackErrorIcon=ic ic-error
kcFeedbackWarningIcon=ic ic-warning
kcFeedbackSuccessIcon=ic ic-success
kcFeedbackInfoIcon=ic ic-info
kcFormPasswordVisibilityIconShow=ic ic-eye
kcFormPasswordVisibilityIconHide=ic ic-eye-off
kcResetFlowIcon=ic ic-restart
