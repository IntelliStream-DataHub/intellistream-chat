services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: intellistream_chat
      POSTGRES_USER: ichat_role
      POSTGRES_PASSWORD: ichat_role
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Mount at /var/lib/postgresql (not /var/lib/postgresql/data) — required by
      # postgres:18+, which puts the cluster in a major-version subdirectory so
      # in-place pg_upgrade --link can run without mount-point boundary issues.
      # See https://github.com/docker-library/postgres/pull/1259.
      - intellistream-chat-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ichat_role -d intellistream_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    # The three --spi-theme flags are the edit loop for keycloak/themes/intellistream: no
    # resolved-theme cache, no compiled-template cache, and Cache-Control: no-cache instead of the
    # thirty-day max-age on theme resources (CSS, fonts, the logo). A browser reload is then the
    # whole cycle — no container restart.
    #
    # `start-dev` already defaults this way (measured: a CSS edit is served immediately by a plain
    # start-dev container, and theme resources come back `no-cache`), so these are belt and braces.
    # They are here because the dev-profile defaults are not visible from this file: switch the
    # command to `start` for a production-shaped test and caching silently comes back on, at which
    # point an explicit flag is the difference between "why is my CSS stale" and a line to delete.
    # Never carry them to production — see QUICKSTART-MANUAL.md § "Branding the login page".
    command:
      - "start-dev"
      - "--import-realm"
      - "--spi-theme-cache-themes=false"
      - "--spi-theme-cache-templates=false"
      - "--spi-theme-static-max-age=-1"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      # The address the *browser* reaches Keycloak at — it lands in the issuer claim and in every
      # URL Keycloak hands the browser, so it cannot stay loopback once anything but this host
      # signs in. Override in .env (KC_HOSTNAME=http://<lan-ip>:8081) rather than editing here;
      # podman-compose does not merge `environment` from compose.override.yml, only lists.
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro,Z,U
      # Custom login theme. `themes/` is the whole directory Keycloak scans, so the mount is the
      # parent, not themes/intellistream — that way adding a second theme needs no compose change.
      # Flags, all three load-bearing under rootless Podman:
      #   ro  the server only ever reads it
      #   Z   private SELinux relabel; without it the container gets EACCES on an enforcing host
      #
      # Deliberately NO `U`. That flag chowns the source to the container's remapped UID, which is
      # needed when the container must WRITE — Keycloak only reads a theme. What it costs is that
      # the files stop being yours to edit, and the moment anyone hands them back
      # (`podman unshare chown`), the container loses access and Keycloak silently falls back to
      # its built-in theme: the login page keeps working, just unbranded, and the only evidence is
      # a "Failed to find LOGIN theme" line in its log. Read access needs no ownership at all —
      # the files are world-readable, which is the whole requirement.
      - ./keycloak/themes:/opt/keycloak/themes:ro,Z

  # Optional secret backend. Profile-gated so the default `podman compose up -d` skips it —
  # only `podman compose --profile openbao up -d` brings it online. The app itself works
  # fine without OpenBao (env-var → application.yml default chain handles credentials);
  # this service is here for operators who want to test the Vault integration locally.
  #
  # Dev mode: in-memory storage, single root token. Don't ship this to prod — replace with
  # a sealed deployment + auto-unseal + AppRole/k8s auth as your real secret manager.
  openbao:
    image: docker.io/openbao/openbao:latest
    profiles: ["openbao"]
    command: ["server", "-dev"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: intellistream-dev-token
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_ADDR: http://0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      # IPC_LOCK lets OpenBao call mlock() so unsealed secret material isn't swapped to disk.
      # Required on Linux; without it the dev server logs a warning and runs with reduced
      # protection (still fine for local-dev experimentation).
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  intellistream-chat-pg:
