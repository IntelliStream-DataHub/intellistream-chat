# nginx_example.conf — reverse proxy + TLS terminator in front of ThreadOrbit.
#
# Drop into /etc/nginx/conf.d/threadorbit.conf (or include from your site config),
# adjust the marked TODOs, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes:
#   - the chat app is reachable on 127.0.0.1:8080 (set SERVER_ADDRESS=127.0.0.1)
#   - Keycloak is reachable on 127.0.0.1:8081 (only matters if you proxy it; see bottom)
#   - certificates are managed by certbot / your favourite ACME client

# ---------------------------------------------------------------------------
# 1. HTTP -> HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name chat.example.com;     # TODO: your hostname

    # Permit ACME HTTP-01 challenges for cert renewal:
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;     # TODO: your webroot, or remove if using DNS-01
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 2. The chat app
# ---------------------------------------------------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name chat.example.com;     # TODO: your hostname

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;  # TODO
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;    # TODO
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Edge security headers --------------------------------------------
    # The Spring app already sets X-Content-Type-Options, frame-ancestors,
    # Referrer-Policy and a strict CSP. HSTS belongs at the TLS layer.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Upload body size -------------------------------------------------
    # The chat app streams uploads to disk via Apache Commons FileUpload — there
    # is no application-side ceiling. Setting `0` disables nginx's check too,
    # so the only practical limits are disk space, request timeout, and any
    # outer limits your hosting (firewall, load balancer) imposes.
    # If you want a soft cap (recommended for internet-facing deployments),
    # set this to a concrete value, e.g. `client_max_body_size 500m;`.
    client_max_body_size 0;
    client_body_buffer_size 128k;

    # --- Proxy defaults ---------------------------------------------------
    proxy_http_version    1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # spring's `server.forward-headers-strategy: framework` reads these.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # --- WebSocket: STOMP over native WS at /ws ---------------------------
    # Needs the Upgrade/Connection headers and a much longer read timeout
    # than the default 60s (chat sessions are idle most of the time).
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Everything else (HTML, REST, static assets) ----------------------
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

