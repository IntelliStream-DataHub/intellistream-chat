name: Release

on:
  release:
    types: [published]

# One release build at a time; re-publishing (e.g. editing a release's notes) shouldn't race a
# prior run for the same tag.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

permissions:
  contents: write # to attach the release files to the release

jobs:
  build:
    name: Build, test, and attach release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same as ci.yml: ubuntu-latest ships a running Docker daemon, so Testcontainers (the
      # integration tests' real-Postgres backend) works with no extra setup.
      - name: Build, test, and bundle assets
        run: ./gradlew build --no-daemon --stacktrace

      # bootJar's name comes from build.gradle.kts's `version`, a fixed placeholder that isn't
      # bumped per tag, so the script names everything after the release tag instead. It picks the
      # runnable jar and leaves the plain classes jar Boot also writes out of the release.
      - name: Package the release tarball
        run: ./scripts/package-release.sh "${{ github.event.release.tag_name }}"

      - name: Attach the tarball, jar and checksums to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/intellistream-chat-${{ github.event.release.tag_name }}.tar.gz
            build/release/intellistream-chat-${{ github.event.release.tag_name }}.jar
            build/release/SHA256SUMS

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
