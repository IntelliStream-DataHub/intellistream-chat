name: Release

on:
  release:
    types: [published]

# One release build at a time; re-publishing (e.g. editing a release's notes) shouldn't race a
# prior run for the same tag.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

permissions:
  contents: write # to attach the jar to the release

jobs:
  build:
    name: Build, test, and attach release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same as ci.yml: ubuntu-latest ships a running Docker daemon, so Testcontainers (the
      # integration tests' real-Postgres backend) works with no extra setup.
      - name: Build, test, and bundle assets
        run: ./gradlew build --no-daemon --stacktrace

      # bootJar's name comes from build.gradle.kts's `version`, a fixed placeholder that isn't
      # bumped per tag — so the jar on disk reads e.g. intellistream-chat-1.0.0.jar regardless of
      # which release this is. Renaming to the release tag is what makes the asset on the GitHub
      # release page actually match the release it is attached to. The plain (non-executable)
      # classes jar Boot's plugin also drops in build/libs/ is excluded on purpose — it can't run
      # on its own and isn't what a release download is for.
      - name: Rename jar to match the release tag
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-plain.jar')
          cp "$jar" "intellistream-chat-${{ github.event.release.tag_name }}.jar"

      - name: Attach jar to the release
        uses: softprops/action-gh-release@v2
        with:
          files: intellistream-chat-${{ github.event.release.tag_name }}.jar

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
