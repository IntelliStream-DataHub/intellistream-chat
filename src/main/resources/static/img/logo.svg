<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Radiance">
  <title>Radiance</title>
  <!-- Speech-bubble silhouette (rounded rect with bottom-left tail). White fill keeps the
       outline readable on the dark sidebar / topbar; on a light favicon tab the bubble
       drops out and just the sunburst remains, which still reads as "Radiance". -->
  <path d="M12 4 H52 A8 8 0 0 1 60 12 V36 A8 8 0 0 1 52 44 H28 L18 56 V44 H12 A8 8 0 0 1 4 36 V12 A8 8 0 0 1 12 4 Z"
        fill="#ffffff"/>
  <!-- Radial-gradient halo around the disc — gives a soft "glow" at topbar size. Disappears
       at 16×16 favicon scale, which is fine; the solid sunburst below still resolves clearly. -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="24" r="11" fill="url(#halo)"/>
  <!-- Solid amber centre + amber cardinal rays. -->
  <circle cx="32" cy="24" r="5.5" fill="#f59e0b"/>
  <g stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" fill="none">
    <line x1="32" y1="11"   x2="32"   y2="15.5"/>
    <line x1="32" y1="32.5" x2="32"   y2="37"/>
    <line x1="13" y1="24"   x2="17.5" y2="24"/>
    <line x1="46.5" y1="24" x2="51"   y2="24"/>
  </g>
  <!-- Diagonal rays in deeper orange — gives the mark a touch of two-tone depth at larger
       sizes. Same stroke geometry so the eight rays read as one sunburst, not two layers. -->
  <g stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" fill="none">
    <line x1="18.6" y1="10.6" x2="21.7" y2="13.7"/>
    <line x1="42.3" y1="34.3" x2="45.4" y2="37.4"/>
    <line x1="45.4" y1="10.6" x2="42.3" y2="13.7"/>
    <line x1="21.7" y1="34.3" x2="18.6" y2="37.4"/>
  </g>
</svg>
