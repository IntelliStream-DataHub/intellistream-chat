<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IntelliStream Chat">
  <title>IntelliStream Chat</title>
  <!-- "Thread in orbit": the thread IS the orbit. A solid core (the root message), a faint full
       ring (the path a conversation travels), and a bold three-quarter arc sweeping around it with
       an amber bead at its leading tip (the newest reply, still arriving).

       Why this shape: it says both halves of the name in one figure, and it survives being shrunk.
       The previous mark was a speech bubble with three dots plus two orbiting objects — at 16px
       the dots filled in and it read as an indistinct blob. Here the silhouette is a core, an arc
       and one accent dot, which stays legible all the way down to a favicon.

       Animated via CSS inside the SVG so it works from an <img> tag, needs no scripts (CSP), and
       honours reduced-motion. Colours are pinned rather than currentColor because an SVG loaded
       via <img> is an isolated document and inherits nothing from the page; the inline themed
       variant lives in templates/fragments/logo.html. -->
  <style>
    .thread {
      transform-origin: 32px 32px;
      transform-box: view-box;
      animation: to-spin 12s linear infinite;
    }
    @keyframes to-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .thread { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="to-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d8eff"/>
      <stop offset="1" stop-color="#1c58d9"/>
    </linearGradient>
    <linearGradient id="to-thread" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1c58d9"/>
      <stop offset="1" stop-color="#5d8eff"/>
    </linearGradient>
  </defs>

  <!-- The orbit the conversation travels -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#8aa8e0" stroke-width="1.5" opacity="0.35"/>

  <!-- The thread itself, with the newest message at its leading tip -->
  <g class="thread">
    <path d="M 32 55 A 23 23 0 1 1 55 32" fill="none" stroke="url(#to-thread)"
          stroke-width="5" stroke-linecap="round"/>
    <circle cx="55" cy="32" r="5" fill="#f59e0b"/>
  </g>

  <!-- Root message -->
  <circle cx="32" cy="32" r="8.5" fill="url(#to-core)"/>
</svg>
