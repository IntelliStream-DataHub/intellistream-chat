spring:
  application:
    name: intellistream-chat

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${ICHAT_DB_URL:jdbc:postgresql://localhost:5432/intellistream_chat}
    username: ${ICHAT_DB_USERNAME:ichat_role}
    password: ${ICHAT_DB_PASSWORD:ichat_role}
    # Optional read replica: see ichat.datasource.replica below.

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:ichat-client}
            # No default — operators MUST supply the secret via env (or Vault). The previous
            # default was the dev secret baked into keycloak/realm.json; if that string ever
            # leaves the repo it becomes a credential. For local dev, export it from realm.json:
            #   export KEYCLOAK_CLIENT_SECRET=$(jq -r '.clients[] | select(.clientId=="ichat-client") | .secret' keycloak/realm.json)
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Keycloak
        provider:
          keycloak:
            # Default points at a localhost-bound Keycloak. Local-dev with the bundled
            # docker-compose stack (Keycloak bound to a LAN IP) overrides this in
            # application-dev.properties. Production sets KEYCLOAK_ISSUER_URI explicitly.
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/ichat-realm}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/ichat-realm}

  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}
  # Default binds localhost only — safe for any environment, including a misconfigured
  # production deploy that forgot to set SERVER_ADDRESS. The dev profile overrides this
  # to the maintainer's LAN IP so phones / other devices can reach the app during
  # mobile-layout testing.
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework
  servlet:
    session:
      # Match Keycloak's SSO Session Idle (8h). Keycloak is the authoritative
      # session lifetime — change it there (Realm settings → Sessions) and bump
      # this to match if you want them to expire together.
      timeout: 8h
      # JSESSIONID Secure flag is auto-detected per request via Tomcat (it ORs
      # SessionCookieConfig.isSecure() with request.isSecure()). With
      # forward-headers-strategy: framework (above), an X-Forwarded-Proto: https
      # request is treated as secure and the cookie is marked Secure automatically.
      # SameSite is set programmatically via SecurityConfig.sessionCookieSameSite.

ichat:
  # JS/CSS asset bundles (assets.gradle / ASSETS.md). Default (false) serves the minified,
  # hash-versioned bundles built by `buildAssets`. The dev profile flips this to true to serve
  # the original source files — edit + refresh, no rebuild.
  assets:
    unbundled: ${ICHAT_ASSETS_UNBUNDLED:false}

  # Optional second connection pool against a Postgres read replica (ReadReplicaDataSourceConfig).
  # Off by default, and off means genuinely absent — no proxy, no second pool, nothing to go wrong.
  #
  # When enabled, a transaction annotated @Transactional(readOnly = true) is served from the
  # replica; writes, migrations and raw JDBC access stay on the primary. That is the whole routing
  # rule, and there is no per-query annotation. Note that a Spring Data repository call made
  # outside a transaction counts as read-only — SimpleJpaRepository declares it — so it goes to
  # the replica too.
  #
  # What it buys and what it costs: the primary stops serving the channel history, search result
  # hydration and sidebar reads that make up most of the query volume, which is the relief worth
  # having on a busy instance. The cost is that a replica lags, so a read-only transaction can see
  # a slightly older world than the write that just returned. That is fine for reading history and
  # wrong for a read that decides to delete something — the Lucene reconcile sweeps use a plain
  # @Transactional for exactly that reason. Keep new code on the same rule.
  #
  # username/password are optional: blank inherits spring.datasource.*, which is what a streaming
  # replica normally wants. Size the pool with ichat.datasource.replica.hikari.* (Boot's usual
  # Hikari keys) — the read pool is generally the one that wants to be larger.
  #
  # All four keys can equally come from Vault as db.replica-enabled / db.replica-url /
  # db.replica-username / db.replica-password.
  datasource:
    replica:
      enabled: ${ICHAT_DB_REPLICA_ENABLED:false}
      url: ${ICHAT_DB_REPLICA_URL:}
      username: ${ICHAT_DB_REPLICA_USERNAME:}
      password: ${ICHAT_DB_REPLICA_PASSWORD:}

  attachments:
    dir: ${ICHAT_ATTACHMENTS_DIR:./data/attachments}
    # Default total an account may store, in bytes (2 GiB). A per-account override lives in
    # user_storage.quota_bytes; negative here (or there) means unlimited. Admins are exempt —
    # see StorageQuotaService for why.
    #
    # This is a *total*, not a per-file limit: there is no cap on how large one upload may be, so
    # the largest file an ordinary account can send is whatever is left of this allowance. Raise it
    # (or clear a specific account's quota in the admin console) for people who need to move
    # something big.
    #
    # This is not what keeps the volume from filling: a filesystem quota on the attachments
    # dataset is. This is what keeps one account from spending everybody else's share first.
    user-quota-bytes: ${ICHAT_USER_QUOTA_BYTES:2147483648}
    # Refuse uploads while the attachments filesystem has less than this free (64 MiB), so the
    # last of the disk is left for Postgres and for Lucene segment merges rather than spent on
    # one more attachment. Raise it if the Lucene index shares the volume — a merge transiently
    # needs room for a second copy of the segments it is merging. Zero disables the check.
    min-free-bytes: ${ICHAT_MIN_FREE_BYTES:67108864}
  avatars:
    dir: ${ICHAT_AVATARS_DIR:./data/avatars}
  branding:
    dir: ${ICHAT_BRANDING_DIR:./data/branding}

  # 1:1 audio and video calls (WebRTC). OFF until turn-urls and turn-secret are both set — see
  # CallProperties. The app is not in the media path at any point: it relays SDP and ICE candidates
  # over the existing WebSocket and the audio/video itself goes through coturn, which forwards
  # encrypted UDP without being able to read it.
  #
  # Sizing, since this is the one feature that does not fit the README's 900 MB / one-core box: a
  # relayed 1:1 audio call costs the relay ~128 kbps and a video call ~4 Mbps, counting both
  # directions. Bandwidth binds long after coturn's packet-rate CPU does.
  calls:
    enabled: ${ICHAT_CALLS_ENABLED:true}
    # e.g. turn:chat.example.com:3478?transport=udp,turns:chat.example.com:5349?transport=tcp
    # Configure BOTH. The UDP entry is the fast path; the TURNS entry on a TLS port is the one that
    # survives a corporate firewall, because on the wire it is indistinguishable from HTTPS.
    turn-urls: ${ICHAT_TURN_URLS:}
    # Must equal coturn's `static-auth-secret`. No default: a guessable secret is an open relay,
    # and the bandwidth it gives away is yours.
    turn-secret: ${ICHAT_TURN_SECRET:}
    stun-urls: ${ICHAT_STUN_URLS:}
    credential-ttl: ${ICHAT_TURN_CREDENTIAL_TTL:10m}
    # Relay every call rather than letting peers connect directly. Costs bandwidth and buys two
    # things: uniform behaviour (calls do not work for most people and fail behind hostile NATs),
    # and neither participant learning the other's IP address. Set false to allow direct
    # connections where they work, with the relay as fallback.
    force-relay: ${ICHAT_CALLS_FORCE_RELAY:true}
    video: ${ICHAT_CALLS_VIDEO:true}
    ring-timeout: ${ICHAT_CALLS_RING_TIMEOUT:45s}

  # Fallback timezone for users whose zone we don't know: no choice saved on the profile page and
  # no `zoneinfo` claim from the identity provider. It decides what "/remind me at 09:00" means,
  # so on a server in a different zone from its users this is worth setting to where the people
  # are. Empty (the default) means the JVM's own zone, which is the behaviour that predates
  # per-user zones.
  default-zone: ${ICHAT_DEFAULT_ZONE:}

  # Identity. Accounts are keyed on the OIDC subject, which the identity provider promises not to
  # change for a person — per realm. Move the app to a dedicated Keycloak realm with the old one
  # brokered in as an identity provider, and everyone arrives with a new subject and their old
  # email. With this on (the default) a never-seen subject whose email is VERIFIED and matches
  # exactly one existing account re-keys that account instead of creating a second one; the
  # history stays where it was. Unverified emails never link, and neither does an email two
  # accounts already share. Turn it off where an address can be reassigned to a different person
  # and must not inherit the previous holder's account.
  identity:
    link-by-verified-email: ${ICHAT_IDENTITY_LINK_BY_VERIFIED_EMAIL:true}

  # Moderation. An admin removing messages is a SOFT delete: the rows stay, drop out of every
  # read path, and stay recoverable until the retention window passes — the first ban is
  # sometimes the wrong ban. RetentionPurgeScheduler then hard-deletes them for good.
  #
  #   retention-days   how long a removed message stays recoverable. 0 (or negative) keeps
  #                    removed messages forever, which disables the purge.
  #   purge-enabled    master switch. @EnableScheduling runs on every node, so set this false
  #                    on all but one when running more than a single instance.
  #   purge-max-batches * purge-batch-size caps how much one sweep will remove; a bigger
  #                    backlog is carried to the next run rather than sat through in one
  #                    long transaction.
  moderation:
    retention-days: ${ICHAT_RETENTION_DAYS:30}
    purge-enabled: ${ICHAT_PURGE_ENABLED:true}
    purge-interval-ms: ${ICHAT_PURGE_INTERVAL_MS:3600000}
    purge-batch-size: 500
    purge-max-batches: 200

  # Optional Vault / OpenBao secret backend. Off by default — the env-var → application.yml
  # default chain handles credentials. When enabled=true, VaultEnvironmentPostProcessor reads
  # the KV-v2 record at ${path} (<mount>/<key>, or a bare key under secret/) and overrides
  # spring.datasource.* + spring.security.oauth2.* before the auto-configurations consume them.
  #
  # Vault record shape (KV-v2 fields, each optional):
  #   db.url / db.username / db.password              - Postgres connection
  #   db.replica-enabled / -url / -username / -password - optional read replica
  #   keycloak.client-id / keycloak.client-secret       - OIDC client
  #   keycloak.issuer-uri                              - realm URL (client + resource server)
  #
  # Exactly one credential: a token, or an AppRole (role-id + secret-id; either half may come from
  # a file via the -file variant, which is how systemd LoadCredential= hands a secret over). With
  # AppRole the token is minted at boot, used for the single read and revoked; it never appears in
  # the environment.
  vault:
    enabled: ${ICHAT_VAULT_ENABLED:false}
    uri: ${ICHAT_VAULT_URI:}
    path: ${ICHAT_VAULT_PATH:intellistream-chat}
    token: ${ICHAT_VAULT_TOKEN:}
    role-id: ${ICHAT_VAULT_ROLE_ID:}
    role-id-file: ${ICHAT_VAULT_ROLE_ID_FILE:}
    secret-id: ${ICHAT_VAULT_SECRET_ID:}
    secret-id-file: ${ICHAT_VAULT_SECRET_ID_FILE:}
    approle-path: ${ICHAT_VAULT_APPROLE_PATH:approle}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
