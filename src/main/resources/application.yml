spring:
  application:
    name: intellistream-chat

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${ICHAT_DB_URL:jdbc:postgresql://localhost:5432/intellistream_chat}
    username: ${ICHAT_DB_USERNAME:ichat_role}
    password: ${ICHAT_DB_PASSWORD:ichat_role}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:ichat-client}
            # No default — operators MUST supply the secret via env (or Vault). The previous
            # default was the dev secret baked into keycloak/realm.json; if that string ever
            # leaves the repo it becomes a credential. For local dev, export it from realm.json:
            #   export KEYCLOAK_CLIENT_SECRET=$(jq -r '.clients[] | select(.clientId=="ichat-client") | .secret' keycloak/realm.json)
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Keycloak
        provider:
          keycloak:
            # Default points at a localhost-bound Keycloak. Local-dev with the bundled
            # docker-compose stack (Keycloak bound to a LAN IP) overrides this in
            # application-dev.properties. Production sets KEYCLOAK_ISSUER_URI explicitly.
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/ichat-realm}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/ichat-realm}

  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}
  # Default binds localhost only — safe for any environment, including a misconfigured
  # production deploy that forgot to set SERVER_ADDRESS. The dev profile overrides this
  # to the maintainer's LAN IP so phones / other devices can reach the app during
  # mobile-layout testing.
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework
  servlet:
    session:
      # Match Keycloak's SSO Session Idle (8h). Keycloak is the authoritative
      # session lifetime — change it there (Realm settings → Sessions) and bump
      # this to match if you want them to expire together.
      timeout: 8h
      # JSESSIONID Secure flag is auto-detected per request via Tomcat (it ORs
      # SessionCookieConfig.isSecure() with request.isSecure()). With
      # forward-headers-strategy: framework (above), an X-Forwarded-Proto: https
      # request is treated as secure and the cookie is marked Secure automatically.
      # SameSite is set programmatically via SecurityConfig.sessionCookieSameSite.

ichat:
  # JS/CSS asset bundles (assets.gradle / ASSETS.md). Default (false) serves the minified,
  # hash-versioned bundles built by `buildAssets`. The dev profile flips this to true to serve
  # the original source files — edit + refresh, no rebuild.
  assets:
    unbundled: ${ICHAT_ASSETS_UNBUNDLED:false}

  attachments:
    dir: ${ICHAT_ATTACHMENTS_DIR:./data/attachments}
    # Default total an account may store, in bytes (2 GiB). A per-account override lives in
    # user_storage.quota_bytes; negative here (or there) means unlimited. Admins are exempt —
    # see StorageQuotaService for why.
    #
    # This is not what keeps the volume from filling: a filesystem quota on the attachments
    # dataset is. This is what keeps one account from spending everybody else's share first.
    user-quota-bytes: ${ICHAT_USER_QUOTA_BYTES:2147483648}
    # Refuse uploads while the attachments filesystem has less than this free (64 MiB), so the
    # last of the disk is left for Postgres and for Lucene segment merges rather than spent on
    # one more attachment. Raise it if the Lucene index shares the volume — a merge transiently
    # needs room for a second copy of the segments it is merging. Zero disables the check.
    min-free-bytes: ${ICHAT_MIN_FREE_BYTES:67108864}
  avatars:
    dir: ${ICHAT_AVATARS_DIR:./data/avatars}
  branding:
    dir: ${ICHAT_BRANDING_DIR:./data/branding}

  # Moderation. An admin removing messages is a SOFT delete: the rows stay, drop out of every
  # read path, and stay recoverable until the retention window passes — the first ban is
  # sometimes the wrong ban. RetentionPurgeScheduler then hard-deletes them for good.
  #
  #   retention-days   how long a removed message stays recoverable. 0 (or negative) keeps
  #                    removed messages forever, which disables the purge.
  #   purge-enabled    master switch. @EnableScheduling runs on every node, so set this false
  #                    on all but one when running more than a single instance.
  #   purge-max-batches * purge-batch-size caps how much one sweep will remove; a bigger
  #                    backlog is carried to the next run rather than sat through in one
  #                    long transaction.
  moderation:
    retention-days: ${ICHAT_RETENTION_DAYS:30}
    purge-enabled: ${ICHAT_PURGE_ENABLED:true}
    purge-interval-ms: ${ICHAT_PURGE_INTERVAL_MS:3600000}
    purge-batch-size: 500
    purge-max-batches: 200

  # Optional Vault / OpenBao secret backend. Off by default — the env-var → application.yml
  # default chain handles credentials. When enabled=true, VaultEnvironmentPostProcessor reads
  # secret/data/${path} and overrides spring.datasource.{username,password} +
  # spring.security.oauth2.* before the auto-configurations consume them.
  #
  # Vault record shape (KV-v2 fields):
  #   db.username             - Postgres role
  #   db.password             - Postgres password
  #   keycloak.client-id      - OIDC client id
  #   keycloak.client-secret  - OIDC client secret
  #   keycloak.issuer-uri     - Keycloak realm URL (used by both client + resource server)
  vault:
    enabled: ${ICHAT_VAULT_ENABLED:false}
    uri: ${ICHAT_VAULT_URI:}
    token: ${ICHAT_VAULT_TOKEN:}
    path: ${ICHAT_VAULT_PATH:intellistream-chat}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
