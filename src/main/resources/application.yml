spring:
  application:
    name: chat

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${CHAT_DB_URL:jdbc:postgresql://localhost:5432/chat}
    username: ${CHAT_DB_USERNAME:chat}
    password: ${CHAT_DB_PASSWORD:chat}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:chat}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:chat-secret}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Keycloak
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://192.168.100.98:8081/realms/chat}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://192.168.100.98:8081/realms/chat}

  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:192.168.100.98}
  forward-headers-strategy: framework
  servlet:
    session:
      # Match Keycloak's SSO Session Idle (8h). Keycloak is the authoritative
      # session lifetime — change it there (Realm settings → Sessions) and bump
      # this to match if you want them to expire together.
      timeout: 8h
      cookie:
        # Drives the JSESSIONID Secure flag. SecurityConfig sets the same flag on
        # the CSRF cookie. Both must be true behind HTTPS in production; defaults
        # to false so local-dev over plain HTTP keeps working.
        secure: ${chat.security.cookie-secure:false}

chat:
  attachments:
    dir: ${CHAT_ATTACHMENTS_DIR:./data/attachments}
  avatars:
    dir: ${CHAT_AVATARS_DIR:./data/avatars}
  branding:
    dir: ${CHAT_BRANDING_DIR:./data/branding}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
