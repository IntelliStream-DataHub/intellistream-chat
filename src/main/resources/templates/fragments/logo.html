<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  The app logo mark. When an admin has uploaded a custom logo it renders as a plain <img>.
  Otherwise the bundled "Thread in orbit" mark is INLINED so its fills can ride the active
  theme's CSS variables (an SVG loaded via <img> is an isolated document and can't see
  them) — each theme recolors the mark. Styling + the orbit animation live in app.css
  (.to-logo-* / .to-orbit).

  The mark: a solid core (the root message), a faint ring (the path a conversation travels),
  and a bold arc sweeping round it with an accent bead at its leading tip (the newest reply).
  Kept to four shapes so the silhouette survives being shrunk to a topbar icon.
  Usage: <th:block th:replace="~{fragments/logo :: mark('logo-mark')}"/>
*/-->
<th:block th:fragment="mark(cls)">
    <img th:if="${appHasCustomLogo}" th:src="${appLogoUrl}" th:class="${cls}" alt=""/>
    <svg th:unless="${appHasCustomLogo}" th:class="${cls}" viewBox="0 0 64 64" role="img"
         aria-label="Logo" xmlns="http://www.w3.org/2000/svg">
        <title th:text="${appTitle}">ThreadOrbit</title>
        <circle class="to-logo-ring" cx="32" cy="32" r="23" fill="none" stroke-width="1.5"/>
        <g class="to-orbit">
            <path class="to-logo-thread" d="M 32 55 A 23 23 0 1 1 55 32" fill="none"
                  stroke-width="5" stroke-linecap="round"/>
            <circle class="to-logo-bead" cx="55" cy="32" r="5"/>
        </g>
        <circle class="to-logo-core" cx="32" cy="32" r="8.5"/>
    </svg>
</th:block>
</body>
</html>
