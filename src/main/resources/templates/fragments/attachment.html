<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  A message's attachments, for server-rendered messages — one copy shared by channels.html and
  conversation.html, which used to carry the same forty lines each. The live copy is
  ChatKit.buildAttachmentEl in static/js/chat-kit.js: same markup, same class names. Change one,
  change the other.

  Usage:
    <div th:replace="~{fragments/attachment :: tray(${msg.attachments})}"></div>

  Renders nothing for a null or empty list. Three shapes per attachment:
    - a tombstone (the uploader deleted the file; the message stayed) — not a link, because a
      download that 404s is worse than none;
    - an image, which the lightbox delegate in chat-kit.js opens in place;
    - a file card, which is also what a video starts as. A video card carries data-video-type, and
      chat-kit.js turns it into a player on DOM-ready *if the browser says it can play that type*.
      The decision has to be the browser's, so it is made there, once, for this markup and for
      every live-rendered message alike; without script, or on a browser that can't play the
      format, the card is simply what you get, and it still downloads.
*/-->
<div th:fragment="tray(attachments)" th:if="${attachments != null and !attachments.isEmpty()}"
     class="message-attachments">
    <th:block th:each="a : ${attachments}">
        <span th:if="${a.deletedAt != null}" class="attachment attachment-removed"
              th:title="|Deleted ${fmt.dateTime(a.deletedAt)}${a.deletedBy != null ? ' by ' + a.deletedBy : ''}|">
            <svg class="icon attachment-icon" aria-hidden="true"><use href="#icon-paperclip"/></svg>
            <span class="attachment-info">
                <span class="attachment-name" th:text="${a.filename}">file</span>
                <span class="attachment-meta"
                      th:text="|Deleted ${fmt.dateTime(a.deletedAt)}${a.deletedBy != null ? ' by ' + a.deletedBy : ''}|">removed</span>
            </span>
        </span>
        <a th:if="${a.deletedAt == null and #strings.startsWith(a.contentType, 'image/')}"
           class="attachment-image"
           th:href="@{${a.downloadUrl}}"
           target="_blank" rel="noopener"
           th:title="${a.filename}">
            <img th:src="@{${a.downloadUrl}}" th:alt="${a.filename}" loading="lazy"/>
        </a>
        <a th:if="${a.deletedAt == null and !#strings.startsWith(a.contentType, 'image/')}"
           class="attachment"
           th:href="@{${a.downloadUrl}}"
           th:attr="data-content-type=${a.contentType},data-video-type=${a.videoType}"
           th:title="${a.filename}">
            <svg class="icon attachment-icon"><use th:href="${a.videoType != null} ? '#icon-video' : '#icon-paperclip'" href="#icon-paperclip"/></svg>
            <span class="attachment-info">
                <span class="attachment-name" th:text="${a.filename}">file</span>
                <span class="attachment-meta">
                    <span th:text="${a.contentType}">type</span> ·
                    <span th:text="${#numbers.formatDecimal(a.sizeBytes / 1024.0, 1, 1) + ' KiB'}">size</span>
                </span>
            </span>
            <svg class="icon attachment-download"><use href="#icon-download"/></svg>
        </a>
    </th:block>
</div>
</body>
</html>
