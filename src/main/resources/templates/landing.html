<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#1e325c"/>
    <title th:text="${appTitle}">ThreadOrbit</title>
    <link rel="icon" th:href="${appFaviconUrl}"/>
    <th:block th:replace="~{fragments/assets :: css('app')}"/>
</head>
<body class="landing">
<main>
    <h1>
        <th:block th:replace="~{fragments/logo :: mark('landing-logo')}"/>
        <span th:text="${appTitle}">ThreadOrbit</span>
    </h1>
    <p>A Slack/Mattermost-style workspace.</p>
    <p>
        <a class="btn" th:href="@{/oauth2/authorization/keycloak}">Sign in with Keycloak</a>
        <a class="btn btn-secondary" th:href="@{/oauth2/authorization/keycloak(action=register)}">Create account</a>
    </p>
</main>
</body>
</html>
