<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#1e325c"/>
    <title th:text="(${activeConversation != null ? activeConversation.title : 'Direct messages'}) + ' · ' + ${appTitle}">Direct message · IntelliStream Chat</title>
    <link rel="icon" th:href="${appFaviconUrl}"/>
    <th:block th:replace="~{fragments/assets :: css('app')}"/>
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>
    <!-- Workspace-admin flag (realm role ichat-admin -> ROLE_ADMIN); read by the avatar
         dropdown to decide whether to offer the Admin console item. Distinct from the
         channel-scoped me-is-admin meta on the chat pages. -->
    <meta name="me-is-workspace-admin" sec:authorize="hasRole('ADMIN')" content="true"/>
    <meta name="me-username" th:content="${me.username}"/>
    <!--/* Account-wide notification default: ALL, MENTIONS or NONE — never DEFAULT.
           A channel row resolves as data-notify-level == DEFAULT ? this : its own. */-->
    <meta name="me-notify-default" th:content="${sidebar.notifyDefault}"/>
    <meta name="me-display" th:content="${me.displayName}"/>
    <meta name="active-conversation-id" th:content="${activeConversationId}"/>
    <meta name="me-is-admin" th:content="${isAdmin == true ? 'true' : 'false'}"/>
</head>
<body class="app conversation-page" th:attr="data-theme=${me.theme}">

<th:block th:replace="~{fragments/icon-sprite :: sprite}"/>

<th:block th:replace="~{fragments/topbar :: topbar}"></th:block>

<div class="layout">
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

    <main class="content">
        <div class="channel-view"
             th:attr="data-conversation-type=${activeConversation.type.name()}">
            <div class="channel-header">
                <div class="channel-header-info">
                    <h1>
                        <span class="avatar" th:if="${activeConversation.otherUsername != null}"
                              th:data-author="${activeConversation.otherUsername}"
                              style="margin-right:0.5rem;vertical-align:middle">
                            <img th:if="${activeConversation.otherHasAvatar}" class="avatar-image" alt=""
                                 th:src="@{/api/users/{u}/avatar(u=${activeConversation.otherUsername},v=${activeConversation.otherAvatarVersion})}"/>
                            <span class="avatar-letter"
                                  th:text="${#strings.toUpperCase(#strings.substring(activeConversation.title, 0, 1))}">U</span>
                        </span>
                        <svg th:if="${activeConversation.type.name() == 'GROUP'}"
                             class="icon group-header-icon" aria-hidden="true"><use href="#icon-group"/></svg>
                        <span th:text="${activeConversation.title}">DM</span>
                    </h1>
                </div>
                <div class="channel-header-actions" th:if="${activeConversation.type.name() == 'GROUP'}">
                    <button type="button" id="group-members-toggle" class="icon-btn"
                            aria-haspopup="true" aria-expanded="false"
                            aria-controls="group-members-panel"
                            title="Group members" aria-label="Group members">
                        <svg class="icon"><use href="#icon-users"/></svg>
                        <span id="group-members-count">…</span>
                    </button>
                </div>

                <section id="group-members-panel"
                         class="channel-admin-dropdown"
                         th:if="${activeConversation.type.name() == 'GROUP'}"
                         role="dialog"
                         aria-labelledby="group-members-title"
                         hidden>
                    <header>
                        <h3 id="group-members-title">Members</h3>
                        <button type="button" id="group-members-close" class="icon-btn" title="Close" aria-label="Close">
    <svg class="icon"><use href="#icon-close"/></svg>
</button>
                    </header>
                    <form id="group-add-member-form" class="invite-form">
                        <label>Invite user (username)
                            <input name="username" required autocomplete="off"/>
                        </label>
                        <button type="submit" class="invite-submit"
                                title="Invite to group" aria-label="Invite to group">
                            <svg class="icon" aria-hidden="true"><use href="#icon-user-plus"/></svg>
                        </button>
                    </form>
                    <h4>In this group</h4>
                    <ul class="members members-cols" id="group-members-list">
                        <li class="dm-empty">Loading…</li>
                    </ul>
                </section>
            </div>

            <div class="messages-stack">
                <ol id="messages" class="messages">
                    <th:block th:each="msg, iter : ${messages}"
                              th:with="prev=${iter.index > 0 ? messages[iter.index - 1] : null},
                                       curDay=${#temporals.format(msg.createdAt, 'yyyy-MM-dd')},
                                       prevDay=${prev != null ? #temporals.format(prev.createdAt, 'yyyy-MM-dd') : ''},
                                       showDay=${prev == null or curDay != prevDay},
                                       sameAuthor=${prev != null and prev.authorUsername == msg.authorUsername and !showDay},
                                       nameKey=${msg.authorDisplayName ?: msg.authorUsername}">
                        <li class="message"
                            th:classappend="${(sameAuthor ? 'grouped ' : '') + (showDay ? 'first-of-day' : '')}"
                            th:data-id="${msg.id}" th:data-created-at="${msg.createdAt}"
                            th:data-author="${msg.authorUsername}"
                            th:data-day="${curDay}"
                            th:attr="data-body-markdown=${msg.bodyMarkdown}">
                            <span class="avatar" th:data-author="${msg.authorUsername}">
                                <img th:if="${msg.authorHasAvatar}" class="avatar-image" alt=""
                                     th:src="@{/api/users/{u}/avatar(u=${msg.authorUsername},v=${msg.authorAvatarVersion})}"/>
                                <span class="avatar-letter"
                                      th:text="${#strings.toUpperCase(#strings.substring(nameKey, 0, 1))}">U</span>
                            </span>
                            <div>
                                <div class="message-meta">
                                    <span class="author" th:data-author="${msg.authorUsername}" th:text="${nameKey}">user</span>
                                    <time th:text="${#temporals.format(msg.createdAt, 'h:mm a')}">time</time>
                                    <span th:if="${msg.editedAt}" class="edited-tag">(edited)</span>
                                </div>
                                <div th:if="${!#strings.isEmpty(msg.bodyMarkdown)}"
                                     class="message-body" th:utext="${msg.bodyHtml}">html</div>
                                <!--/* Attachments were missing from this loop entirely, so a file
                                       posted in a DM rendered as nothing at all on page load and
                                       only appeared if it arrived live over the WebSocket. Same
                                       markup as the channel page, tombstone branch included. */-->
                                <div th:if="${msg.attachments != null and !msg.attachments.isEmpty()}"
                                     class="message-attachments">
                                    <th:block th:each="a : ${msg.attachments}">
                                        <span th:if="${a.deletedAt != null}" class="attachment attachment-removed"
                                              th:title="|Deleted ${#temporals.format(a.deletedAt, 'd MMM yyyy, HH:mm')}${a.deletedBy != null ? ' by ' + a.deletedBy : ''}|">
                                            <svg class="icon attachment-icon" aria-hidden="true"><use href="#icon-paperclip"/></svg>
                                            <span class="attachment-info">
                                                <span class="attachment-name" th:text="${a.filename}">file</span>
                                                <span class="attachment-meta"
                                                      th:text="|Deleted ${#temporals.format(a.deletedAt, 'd MMM yyyy, HH:mm')}${a.deletedBy != null ? ' by ' + a.deletedBy : ''}|">removed</span>
                                            </span>
                                        </span>
                                        <a th:if="${a.deletedAt == null and #strings.startsWith(a.contentType, 'image/')}"
                                           class="attachment-image"
                                           th:href="@{${a.downloadUrl}}"
                                           target="_blank" rel="noopener"
                                           th:title="${a.filename}">
                                            <img th:src="@{${a.downloadUrl}}" th:alt="${a.filename}" loading="lazy"/>
                                        </a>
                                        <a th:if="${a.deletedAt == null and !#strings.startsWith(a.contentType, 'image/')}"
                                           class="attachment"
                                           th:href="@{${a.downloadUrl}}"
                                           th:attr="data-content-type=${a.contentType}"
                                           th:title="${a.filename}">
                                            <svg class="icon attachment-icon"><use href="#icon-paperclip"/></svg>
                                            <span class="attachment-info">
                                                <span class="attachment-name" th:text="${a.filename}">file</span>
                                                <span class="attachment-meta">
                                                    <span th:text="${a.contentType}">type</span> ·
                                                    <span th:text="${#numbers.formatDecimal(a.sizeBytes / 1024.0, 1, 1) + ' KiB'}">size</span>
                                                </span>
                                            </span>
                                            <svg class="icon attachment-download"><use href="#icon-download"/></svg>
                                        </a>
                                    </th:block>
                                </div>
                                <div th:if="${msg.reactions != null and !msg.reactions.isEmpty()}"
                                     class="message-reactions">
                                    <button th:each="r : ${msg.reactions}"
                                            type="button"
                                            class="reaction"
                                            th:classappend="${r.mine ? 'mine' : ''}"
                                            th:data-emoji="${r.emoji}"
                                            th:data-mine="${r.mine}"
                                            th:title="${#strings.listJoin(r.usernames, ', ')}">
                                        <span class="reaction-emoji" th:text="${r.emoji}">x</span>
                                        <span class="reaction-count" th:text="${r.count}">1</span>
                                    </button>
                                </div>
                                <!--/* Same "N replies" widget the channel feed carries, anchored at
                                       the bottom of the message. Rendered server-side here and in
                                       conversation.js for live updates — a message's furniture is
                                       drawn in two places on both pages, and this is the DM half. */-->
                                <button th:if="${msg.replyCount > 0}" type="button"
                                        class="thread-indicator"
                                        th:attr="data-count=${msg.replyCount}"
                                        th:title="|Open thread (${msg.replyCount} ${msg.replyCount == 1 ? 'reply' : 'replies'})|">
                                    <svg class="icon thread-indicator-icon" aria-hidden="true"><use href="#icon-thread"/></svg>
                                    <span class="thread-indicator-count"
                                          th:text="|${msg.replyCount} ${msg.replyCount == 1 ? 'reply' : 'replies'}|">1 reply</span>
                                </button>
                            </div>
                        </li>
                    </th:block>
                </ol>
            </div>

            <!--/* Same element, same class and same place as the channel page's, so the existing
                   .typing-indicator rule covers it. In a 1:1 this line is the whole difference
                   between waiting and giving up. */-->
            <div id="typing-indicator" class="typing-indicator" hidden></div>

            <div class="composer-wrap" th:data-conversation-id="${activeConversationId}">
                <form id="composer" class="composer">
                    <div id="composer-attachments" class="composer-attachments" hidden></div>
                    <textarea id="composer-input"
                              th:placeholder="'Message ' + ${activeConversation.title}"
                              rows="3" maxlength="8000"></textarea>
                    <div id="composer-preview" class="composer-preview" hidden>
                        <div class="composer-preview-label">Preview</div>
                        <div id="composer-preview-body" class="message-body"></div>
                    </div>
                    <div class="composer-toolbar" data-format-target="composer-input">
                        <button type="button" class="tool" data-format="bold" title="Bold (Ctrl/Cmd+B)"><b>B</b></button>
                        <button type="button" class="tool" data-format="italic" title="Italic (Ctrl/Cmd+I)"><i>I</i></button>
                        <button type="button" class="tool" data-format="strike" title="Strikethrough"><s>S</s></button>
                        <button type="button" class="tool" data-format="link" title="Link (Ctrl/Cmd+K)"><svg class="icon" aria-hidden="true"><use href="#icon-link"/></svg></button>
                        <button type="button" class="tool" data-format="code" title="Code (Ctrl/Cmd+E)">{ }</button>
                        <button type="button" class="tool" data-format="quote" title="Quote"><svg class="icon" aria-hidden="true"><use href="#icon-quote"/></svg></button>
                        <button type="button" class="tool" data-format="list" title="Bulleted list"><svg class="icon" aria-hidden="true"><use href="#icon-list"/></svg></button>
                        <button type="button" class="tool" id="composer-emoji" title="Insert emoji"><svg class="icon" aria-hidden="true"><use href="#icon-face-smile"/></svg></button>
                        <button type="button" class="tool" id="composer-attach" title="Attach file" aria-label="Attach file">
    <svg class="icon"><use href="#icon-paperclip"/></svg>
</button>
                        <input type="file" id="composer-file" hidden multiple/>
                        <span class="spacer"></span>
                        <button type="submit" class="send-btn">
                            <svg class="send-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M2.5 20.5 22 12 2.5 3.5 2.5 10 16 12 2.5 14z"/>
                            </svg>
                            <span>Send</span>
                        </button>
                    </div>
                </form>
                <div class="composer-hint">
                    Markdown supported · **bold**, _italic_, `code`, ```blocks```, [links](url) · Enter to send · Shift+Enter for newline
                </div>
            </div>
        </div>
    </main>

    <!--/* The thread panel, with the same ids and classes as the one in channels.html so the
           existing .thread-* CSS (and body.thread-open, which widens .layout by --thread-w)
           applies unchanged. The logic behind it is ChatKit.createThreadPanel, shared by
           construction rather than copied — see the note there. */-->
    <aside id="thread-panel" class="thread-panel" hidden>
        <header class="thread-header">
            <h3>Thread</h3>
            <button type="button" id="thread-close" class="icon-btn" title="Close thread" aria-label="Close thread">
                <svg class="icon"><use href="#icon-close"/></svg>
            </button>
        </header>
        <div id="thread-parent" class="thread-parent"></div>
        <ol id="thread-replies" class="thread-replies"></ol>
        <form id="thread-composer" class="composer thread-composer">
            <textarea id="thread-input" placeholder="Reply to thread…" rows="2" maxlength="8000"></textarea>
            <div id="thread-preview" class="composer-preview" hidden>
                <div class="composer-preview-label">Preview</div>
                <div id="thread-preview-body" class="message-body"></div>
            </div>
            <div class="composer-toolbar" data-format-target="thread-input">
                <button type="button" class="tool" data-format="bold" title="Bold (Ctrl/Cmd+B)"><b>B</b></button>
                <button type="button" class="tool" data-format="italic" title="Italic (Ctrl/Cmd+I)"><i>I</i></button>
                <button type="button" class="tool" data-format="strike" title="Strikethrough"><s>S</s></button>
                <button type="button" class="tool" data-format="link" title="Link (Ctrl/Cmd+K)"><svg class="icon" aria-hidden="true"><use href="#icon-link"/></svg></button>
                <button type="button" class="tool" data-format="code" title="Code (Ctrl/Cmd+E)">{ }</button>
                <button type="button" class="tool" data-format="quote" title="Quote"><svg class="icon" aria-hidden="true"><use href="#icon-quote"/></svg></button>
                <button type="button" class="tool" data-format="list" title="Bulleted list"><svg class="icon" aria-hidden="true"><use href="#icon-list"/></svg></button>
                <button type="button" class="tool" id="thread-emoji" title="Insert emoji"><svg class="icon" aria-hidden="true"><use href="#icon-face-smile"/></svg></button>
                <span class="spacer"></span>
                <button type="submit" class="send-btn">
                    <svg class="send-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M2.5 20.5 22 12 2.5 3.5 2.5 10 16 12 2.5 14z"/>
                    </svg>
                    <span>Reply</span>
                </button>
            </div>
        </form>
    </aside>
</div>

<script th:src="@{/js/vendor/stomp.umd.min.js}"></script>
<!-- Bundled page scripts (assets.gradle); dev serves the source files. See ASSETS.md. -->
<th:block th:replace="~{fragments/assets :: js('conversation')}"/>
<!-- Avatar dropdown (presence + sign out). ES module, so it loads its own graph;
     not part of the Closure bundle (like the rest of js/chat/). -->
<script type="module" th:src="@{/js/chat/presence-menu-boot.js}" defer></script>
<!-- Sidebar channel search + global message search. Same modules the channel page uses;
     this page loads them directly because it doesn't load chat/index.js. -->
<script type="module" th:src="@{/js/chat/conversation-chrome-boot.js}" defer></script>
<!-- @-mention typeahead. Same module the channel page loads; scoped to this conversation's
     participants, which it reads from .composer-wrap[data-conversation-id]. -->
<script type="module" th:src="@{/js/chat/mention-autocomplete-boot.js}" defer></script>

</body>
</html>
