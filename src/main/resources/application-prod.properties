server.address=127.0.0.1

# No defaults for the issuer: the prod profile must not silently validate tokens / run OIDC
# discovery over plaintext HTTP. Set KEYCLOAK_ISSUER_URI to your realm's HTTPS URL — the app
# fails fast if it's missing rather than falling back to http://localhost.
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
ichat.allowed-origins=${ICHAT_ALLOWED_ORIGINS:}

# No default — the prod profile MUST fail fast if the OIDC client secret is unset, exactly
# like application.yml. A committed default here would ship a real credential in the public
# repo (the dev value lives only in keycloak/realm.json, clearly labeled dev-only). Provide
# it via the KEYCLOAK_CLIENT_SECRET env var or Vault, and rotate the bundled dev value before
# any real deployment — see README / QUICKSTART-MANUAL.
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

ichat.dev-tools.enabled=false
