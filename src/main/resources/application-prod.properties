server.address=127.0.0.1

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8081/realms/threadorbit
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/threadorbit
threadorbit.allowed-origins=http://localhost:8080,http://127.0.0.1:8080

# Default to the dev client secret bundled in keycloak/realm.json so a plain
# `SPRING_PROFILES_ACTIVE=prod ./gradlew bootRun` works against the local podman compose
# stack without an extra export step. Real production deploys MUST override this via
# the KEYCLOAK_CLIENT_SECRET env var (or Vault) and rotate the bundled value — see README.
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:DAJpMxDkLxHidawHQXu8MMlmjEiKQRZzWRiLzFBQ}

threadorbit.dev-tools.enabled=false
