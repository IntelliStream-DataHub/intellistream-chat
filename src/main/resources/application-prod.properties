server.address=127.0.0.1

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8081/realms/threadorbit
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/threadorbit
threadorbit.allowed-origins=http://localhost:8080,http://127.0.0.1:8080

# No default — the prod profile MUST fail fast if the OIDC client secret is unset, exactly
# like application.yml. A committed default here would ship a real credential in the public
# repo (the dev value lives only in keycloak/realm.json, clearly labeled dev-only). Provide
# it via the KEYCLOAK_CLIENT_SECRET env var or Vault, and rotate the bundled dev value before
# any real deployment — see README / QUICKSTART-MANUAL.
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

threadorbit.dev-tools.enabled=false
