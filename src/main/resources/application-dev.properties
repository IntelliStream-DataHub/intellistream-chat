# Dev profile — maintainer-specific LAN values for the local docker-compose stack.
#
# The compose stack binds Postgres on 127.0.0.1:5432 and Keycloak on 192.168.100.98:8081
# (so other devices on the LAN can hit the auth endpoint when testing the WS / mobile
# layout from a phone). This profile points the app at those addresses and adds the LAN
# origin to the WebSocket allow-list. Tests don't activate this profile — they use
# Testcontainers and IntegrationTestApplication directly. Production deploys must NOT
# activate this profile (use SPRING_PROFILES_ACTIVE=prod or set env vars explicitly).
#
# bootRun auto-activates dev (configured in build.gradle.kts), so plain
# `./gradlew bootRun` picks these up without any extra flags.

# Bind to the maintainer's LAN IP so other devices on the network can reach the app
# during dev. Plain HTTP only — production uses 127.0.0.1 behind nginx (TLS).
server.address=192.168.100.98

# Keycloak runs in compose at the same LAN IP on 8081. The realm imports
# keycloak/realm.json which configures redirect URIs for both 192.168.100.98:8080
# and localhost:8080.
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://192.168.100.98:8081/realms/radiance
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://192.168.100.98:8081/realms/radiance

# WebSocket / STOMP origin allow-list. CSWSH defence — rejects handshakes from any
# other origin. The LAN entry lets the app accept WS connections when the page is
# served from http://192.168.100.98:8080 (the local-dev URL).
radiance.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://192.168.100.98:8080
