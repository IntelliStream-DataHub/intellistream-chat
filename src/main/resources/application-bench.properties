# Load-benchmark profile. Activate with SPRING_PROFILES_ACTIVE=bench. NEVER use in production —
# it disables the per-user rate limits (so a benchmark driving many connections from one user
# isn't capped by a limit it isn't measuring) and opens the server up for the load generator.
#
# Runtime env (kept out of the committed file):
#   KEYCLOAK_ISSUER_URI      e.g. http://<load-generator-reachable-host>:8081/realms/ichat-realm
#   BENCH_ALLOWED_ORIGINS    the Origins the generator sends (see benchmark/README.md)
#   BENCH_SERVER_ADDRESS     0.0.0.0 so the client can spread connections across loopback IPs
# Heap / GC are passed on the command line (JAVA_TOOL_OPTIONS) — see benchmark/README.md.

ichat.ratelimit.enabled=false

server.address=${BENCH_SERVER_ADDRESS:0.0.0.0}
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/ichat-realm}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/ichat-realm}

# The generator sends Origin: http://127.0.0.<n>:8080 (spreading across loopback IPs) plus the
# host used for the login. setAllowedOriginPatterns supports the wildcard.
ichat.allowed-origins=${BENCH_ALLOWED_ORIGINS:http://127.0.0.*:8080,http://localhost:8080}

# Tomcat: raise the connection ceiling far above the 8192 default; give the acceptor a deep
# backlog and enough worker threads to service the handshake burst.
server.tomcat.max-connections=${BENCH_MAX_CONN:300000}
server.tomcat.accept-count=${BENCH_ACCEPT_COUNT:10000}
server.tomcat.threads.max=${BENCH_TOMCAT_THREADS:400}
server.tomcat.threads.min-spare=50

ichat.dev-tools.enabled=false
ichat.assets.unbundled=false

# Per-stage write-path timers are scraped from /actuator/metrics during a run to get a cost
# breakdown (resolve user / load channel / persist / render / broadcast) instead of guessing.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.metrics.access=read-only

# A bench instance runs alongside a dev instance on the same box; Lucene takes an exclusive
# write lock on its directory, so give the bench run its own index rather than fighting for
# ./data/lucene.
ichat.search.lucene-dir=${BENCH_LUCENE_DIR:./data/lucene-bench}

# Write-behind batching for the message INSERT is on by default application-wide; kept here as an
# explicit knob so a run can A/B it (BENCH_WRITE_BEHIND=false) without editing code.
ichat.write-behind.enabled=${BENCH_WRITE_BEHIND:true}
