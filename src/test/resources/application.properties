# Test-wide overrides. Applies to every Spring context the test source set boots, which is why it
# lives here rather than in a @DynamicPropertySource helper that only some ITs call.

# Synchronous message writes in tests.
#
# The write-behind path deliberately bypasses JPA and inserts through its own JdbcTemplate on a
# background thread. Under a @Transactional integration test — which rolls back for isolation —
# those rows would escape the rollback and leak into whatever runs next, and any post-then-read
# assertion would be racing the flusher rather than testing anything. Production defaults this on;
# tests are the one place where the durability window is a liability rather than a trade.
intellistream.write-behind.enabled=false
